<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>掌柜智库 · 知识库问答</title>
<style>
/* ================= 主题变量（WorkBuddy 深色默认 / 浅色切换） ================= */
:root {
    --bg: #0d1117;
    --panel: #161b22;
    --panel2: #1c2333;
    --border: #21262d;
    --border2: #30363d;
    --text: #e6edf3;
    --muted: #6e7681;
    --muted2: #484f58;
    --accent: #58a6ff;
    --accent2: #3b82f6;
    --accent3: #6366f1;
    --green: #3fb950;
    --warn: #d29922;
    --red: #f85149;
    --shadow: rgba(0,0,0,0.1);
}
body.theme-light {
    --bg: #f6f8fa;
    --panel: #ffffff;
    --panel2: #f0f3f6;
    --border: #d0d7de;
    --border2: #afb8c1;
    --text: #1f2328;
    --muted: #57606a;
    --muted2: #8c959f;
    --accent: #0969da;
    --accent2: #3b82f6;
    --accent3: #6366f1;
    --green: #1a7f37;
    --warn: #9a6700;
    --red: #cf222e;
    --shadow: rgba(0,0,0,0.06);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, "Microsoft YaHei", "Segoe UI", sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: row; transition: background .25s, color .25s; }

/* ================= 侧边栏 ================= */
#sidebar { width: 260px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
#sidebar-header { padding: 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
#sidebar-header .logo { width: 32px; height: 32px; border-radius: 8px; background: linear-gradient(135deg, var(--accent2), var(--accent3)); display: flex; align-items: center; justify-content: center; font-size: 16px; color: #fff; font-weight: 700; }
#sidebar-header .label { font-size: 15px; font-weight: 600; }
#sidebar-header .label small { font-weight: 400; color: var(--muted); font-size: 11px; display: block; }
#sidebar-sections { flex: 1; padding: 8px; overflow-y: auto; }
.sidebar-section-title { font-size: 11px; color: var(--muted); text-transform: uppercase; padding: 8px 12px 4px; letter-spacing: 0.5px; }
.sidebar-item { padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; color: var(--text); display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }
.sidebar-item:hover { background: var(--panel2); }
.sidebar-item.active { background: var(--panel2); color: var(--text); border: 1px solid var(--border); }
.sidebar-item .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
#sessionList { max-height: 260px; overflow-y: auto; margin: 4px 0 8px; }
.session-item { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 7px 12px; font-size: 12.5px; border-radius: 8px; cursor: pointer; color: var(--muted); }
.session-item:hover { background: var(--panel2); color: var(--text); }
.session-item.active { background: var(--panel2); color: var(--text); border: 1px solid var(--border); }
.session-item .st { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.session-item .sx { opacity: .7; font-size: 11px; padding: 2px 5px; border-radius: 4px; }
.session-item .sx:hover { color: var(--red); opacity: 1; }
#sessionEmpty { padding: 6px 12px; font-size: 12px; color: var(--muted2); }
#sidebar-footer { border-top: 1px solid var(--border); padding: 10px 12px; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
#sidebar-footer .avatar { width: 24px; height: 24px; border-radius: 50%; background: linear-gradient(135deg, var(--accent3), #8b5cf6); display: flex; align-items: center; justify-content: center; font-size: 12px; color: #fff; font-weight: 600; flex-shrink: 0; }

/* ================= 主区 ================= */
#main { flex: 1; display: flex; flex-direction: column; background: var(--bg); min-width: 0; }
#topbar { background: var(--panel); border-bottom: 1px solid var(--border); padding: 10px 20px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; flex-wrap: wrap; gap: 8px; }
#topbar .title { font-size: 14px; font-weight: 600; color: var(--text); }
#topbar .title small { font-weight: 400; color: var(--muted); margin-left: 8px; font-size: 11px; }
#topbar .right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
#connDot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted2); display: inline-block; margin-right: 4px; }
#connDot.on { background: var(--green); }
#connDot.busy { background: var(--warn); }
#connText { font-size: 12px; color: var(--muted); }
.tbtn { border: 1px solid var(--border2); background: var(--panel); color: var(--muted); padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; }
.tbtn:hover { border-color: var(--accent); color: var(--accent); }
#themeBtn { color: var(--text); }
.switch { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
.switch input { accent-color: var(--accent2); }

/* ================= 聊天区 ================= */
#chat { flex: 1; overflow-y: auto; padding: 24px 20px; scroll-behavior: smooth; }
#chatInner { max-width: 780px; margin: 0 auto; width: 100%; }

/* 欢迎页 */
#welcome { text-align: center; padding: 60px 20px 30px; }
#welcome .logo { width: 64px; height: 64px; border-radius: 16px; background: linear-gradient(135deg, var(--accent2), var(--accent3)); display: inline-flex; align-items: center; justify-content: center; font-size: 30px; color: #fff; font-weight: 700; box-shadow: 0 4px 16px rgba(59,130,246,0.25); }
#welcome h1 { margin-top: 18px; font-size: 22px; }
#welcome p { margin-top: 8px; color: var(--muted); font-size: 13px; line-height: 1.7; }
#welcome .examples { margin-top: 24px; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
#welcome .example-btn { border: 1px solid var(--border2); background: var(--panel); color: var(--text); padding: 9px 14px; border-radius: 20px; cursor: pointer; font-size: 13px; }
#welcome .example-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--panel2); }

/* 消息 */
.msg { margin-bottom: 20px; display: flex; }
.msg.user { justify-content: flex-end; }
.msg.user .bubble-row { display: flex; flex-direction: column; align-items: flex-end; max-width: 70%; }
.msg.bot { flex-direction: row; gap: 10px; }
.msg.bot .avatar { width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(135deg, var(--accent3), #8b5cf6); display: flex; align-items: center; justify-content: center; font-size: 14px; color: #fff; font-weight: 600; flex-shrink: 0; margin-top: 4px; }
.bubble { padding: 12px 16px; border-radius: 16px; line-height: 1.75; font-size: 14.5px; white-space: pre-wrap; word-break: break-word; max-width: 100%; }
.msg.user .bubble { background: linear-gradient(135deg, var(--accent2), var(--accent3)); color: #fff; border-bottom-right-radius: 4px; box-shadow: 0 1px 3px rgba(59,130,246,0.2); }
.msg.bot .bubble { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-bottom-left-radius: 4px; box-shadow: 0 1px 3px var(--shadow); }
.msg.bot .bubble.thinking { color: var(--muted); font-style: italic; background: var(--bg); border-color: var(--panel2); }
.msg.bot .bubble.error { color: var(--red); border-color: var(--red); background: var(--panel2); }
.msg-tools { display: flex; gap: 6px; margin-top: 4px; }
.msg.user .msg-tools { justify-content: flex-end; }
.msg-tools .copy-btn { border: none; background: transparent; color: var(--muted); font-size: 11.5px; cursor: pointer; padding: 2px 6px; border-radius: 4px; }
.msg-tools .copy-btn:hover { color: var(--accent); background: var(--panel2); }
.msg-tools .copy-btn.copied { color: var(--green); }

/* Markdown 内容样式 */
.bubble h1, .bubble h2, .bubble h3 { margin: 8px 0 6px; line-height: 1.4; }
.bubble h1 { font-size: 18px; } .bubble h2 { font-size: 16.5px; } .bubble h3 { font-size: 15px; }
.bubble p { margin: 4px 0; }
.bubble ul, .bubble ol { padding-left: 20px; margin: 4px 0; }
.bubble li { margin: 2px 0; }
.bubble code { font-family: Consolas, "Courier New", monospace; font-size: 13px; background: var(--panel2); padding: 1px 5px; border-radius: 4px; color: var(--accent); }
.bubble pre { position: relative; background: #10151c; border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin: 8px 0; overflow-x: auto; }
body.theme-light .bubble pre { background: #f6f8fa; }
.bubble pre code { background: transparent; color: var(--text); padding: 0; font-size: 13px; line-height: 1.6; display: block; white-space: pre; }
.copy-code { position: absolute; top: 8px; right: 8px; border: 1px solid var(--border2); background: var(--panel); color: var(--muted); font-size: 11px; padding: 2px 8px; border-radius: 5px; cursor: pointer; opacity: .75; }
.copy-code:hover { opacity: 1; color: var(--accent); }
.bubble a { color: var(--accent); }
.bubble blockquote { border-left: 3px solid var(--accent); padding-left: 10px; color: var(--muted); margin: 6px 0; }
.bubble hr { border: none; border-top: 1px solid var(--border); margin: 8px 0; }

/* 图片与进度面板 */
.imgs { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
.imgs img { max-width: 150px; border-radius: 8px; border: 1px solid var(--border); }
/* 引用溯源（P0-1）：来源区块 */
.sources { margin-top: 12px; padding-top: 8px; border-top: 1px dashed var(--border); }
.sources .src-head { font-size: 12px; color: var(--muted); margin-bottom: 6px; letter-spacing: .3px; }
.sources .src-item { font-size: 12.5px; line-height: 1.7; padding: 6px 8px; border-radius: 8px; background: var(--panel2); margin-bottom: 6px; border: 1px solid transparent; }
.sources .src-item.hl { border-color: var(--accent2); }
.sources .src-idx { color: var(--accent); font-family: Consolas, monospace; }
.sources .src-title { color: var(--text); font-weight: 600; }
.sources .src-title a { color: var(--accent); text-decoration: none; }
.sources .src-badge { display: inline-block; font-size: 10.5px; padding: 0 5px; border-radius: 4px; margin-left: 6px; border: 1px solid var(--border2); color: var(--muted); vertical-align: 1px; }
.sources .src-meta { color: var(--muted); font-size: 11.5px; margin-top: 2px; }
.sources .src-snip { color: var(--muted); margin-top: 4px; white-space: pre-wrap; word-break: break-word; }
.sources .src-more { margin-top: 2px; font-size: 12px; color: var(--accent); background: none; border: none; cursor: pointer; padding: 2px 0; }
.sources .src-more:hover { text-decoration: underline; }
sup.cite { color: var(--accent); cursor: pointer; font-size: 10.5px; padding: 0 2px; }
sup.cite:hover, sup.cite.hl { background: var(--accent2); color: #fff; border-radius: 3px; }
.progress-box { margin-top: 10px; border: 1px solid var(--border); border-radius: 10px; background: var(--panel2); overflow: hidden; }
.progress-head { padding: 8px 12px; font-size: 12.5px; color: var(--muted); cursor: pointer; user-select: none; display: flex; align-items: center; justify-content: space-between; }
.progress-head:hover { background: var(--bg); }
.progress-body { padding: 4px 12px 10px; border-top: 1px solid var(--border); }
.progress-body .row { display: flex; gap: 10px; font-size: 12px; line-height: 1.9; font-family: Consolas, monospace; }
.progress-body .nm { min-width: 200px; color: var(--muted); }
.progress-body .ok { color: var(--green); }
.progress-body .run { color: var(--warn); }
.progress-body .err { color: var(--red); }
.progress-body .wait { color: var(--muted2); }

/* ================= 输入区 ================= */
#composer { background: var(--panel); border-top: 1px solid var(--border); padding: 10px 20px 14px; flex-shrink: 0; }
#composerInner { max-width: 780px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
#queryInput { flex: 1; background: var(--bg); border: 1px solid var(--border2); border-radius: 16px; padding: 12px 16px; font-size: 14.5px; resize: none; font-family: inherit; line-height: 1.6; max-height: 140px; outline: none; color: var(--text); }
#queryInput:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(88,166,255,0.15); }
#sendBtn { background: linear-gradient(135deg, var(--accent2), var(--accent3)); color: #fff; border: none; border-radius: 12px; padding: 12px 24px; font-size: 14.5px; cursor: pointer; white-space: nowrap; box-shadow: 0 1px 4px rgba(59,130,246,0.3); display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-width: 84px; }
#sendBtn:hover { box-shadow: 0 2px 8px rgba(59,130,246,0.4); }
#sendBtn:disabled { background: var(--border2); color: var(--muted2); box-shadow: none; cursor: not-allowed; }
.spinner { display: inline-block; width: 13px; height: 13px; border: 2px solid rgba(255,255,255,.35); border-top-color: #fff; border-radius: 50%; animation: spin .8s linear infinite; }
#sendBtn:disabled .spinner { border-color: var(--muted2); border-top-color: var(--muted); }
@keyframes spin { to { transform: rotate(360deg); } }
#quickBar { max-width: 780px; margin: 0 auto 8px; display: flex; gap: 8px; flex-wrap: wrap; }
.quick-btn { border: 1px solid var(--border2); background: var(--bg); color: var(--muted); padding: 4px 12px; border-radius: 14px; cursor: pointer; font-size: 12px; }
.quick-btn:hover { border-color: var(--accent); color: var(--accent); }
.hint { max-width: 780px; margin: 8px auto 0; font-size: 11.5px; color: var(--muted2); }

/* ================= 弹窗 ================= */
#modalMask { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 100; align-items: center; justify-content: center; }
#modalMask.show { display: flex; }
#modal { width: min(520px, 92vw); max-height: 82vh; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; box-shadow: 0 8px 30px rgba(0,0,0,.35); display: flex; flex-direction: column; }
#modalHead { padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
#modalHead h3 { font-size: 15px; }
#modalClose { border: none; background: transparent; color: var(--muted); font-size: 18px; cursor: pointer; line-height: 1; padding: 4px 8px; border-radius: 6px; }
#modalClose:hover { color: var(--red); background: var(--panel2); }
#modalBody { padding: 16px 18px; overflow-y: auto; font-size: 13px; line-height: 1.8; }
#modalBody .kv { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px dashed var(--border); }
#modalBody .kv b { color: var(--muted); font-weight: 400; flex-shrink: 0; }
#modalBody .kv span { color: var(--text); word-break: break-all; text-align: right; }
#modalBody .ok { color: var(--green); } #modalBody .err { color: var(--red); } #modalBody .warn { color: var(--warn); }
#modalBody .mtitle { font-size: 12px; color: var(--muted); text-transform: uppercase; margin: 14px 0 6px; letter-spacing: .5px; }
#modalBody button { margin-top: 12px; }
#modalBody ul { padding-left: 18px; margin: 6px 0; }
#modalBody li { margin: 3px 0; }

/* ================= Toast ================= */
#toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: var(--panel); color: var(--text); border: 1px solid var(--border2); padding: 9px 18px; border-radius: 20px; font-size: 13px; box-shadow: 0 4px 16px var(--shadow); z-index: 200; opacity: 0; pointer-events: none; transition: opacity .25s; }
#toast.show { opacity: 1; }

/* 文件上传：预览区 / 拖拽高亮 / 上传状态 */
#filePreview { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 2px 6px; }
#filePreview:empty { display: none; }
.fp-item { display: flex; align-items: center; gap: 8px; background: var(--bg2, rgba(255,255,255,.06)); border: 1px solid var(--border2); border-radius: 10px; padding: 6px 10px; max-width: 280px; font-size: 12px; }
.fp-thumb { width: 34px; height: 34px; object-fit: cover; border-radius: 6px; background: #000; flex-shrink: 0; }
.fp-ico { width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--text2, #999); background: var(--bg2, rgba(255,255,255,.06)); border-radius: 6px; flex-shrink: 0; }
.fp-info { display: flex; flex-direction: column; min-width: 0; }
.fp-name { color: var(--text1, #eee); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 160px; }
.fp-size { color: var(--text2, #999); }
.fp-del { background: none; border: none; color: var(--danger, #f66); cursor: pointer; font-size: 15px; padding: 2px 4px; line-height: 1; }
.fp-del:hover { color: #ff8a8a; }
#composer.dragover { outline: 2px dashed var(--accent, #6c8cff); outline-offset: -6px; border-radius: 14px; }
#uploadStatus { font-size: 12px; color: var(--text2, #999); padding: 0 2px 6px; display: flex; align-items: center; gap: 6px; }
#uploadStatus.error { color: var(--danger, #f66); }

/* 滚动条 */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }
::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>
<div id="sidebar">
    <div id="sidebar-header">
        <div class="logo">智</div>
        <div class="label">掌柜智库<small>知识库问答</small></div>
    </div>
    <div id="sidebar-sections">
        <div class="sidebar-section-title">对话</div>
        <div id="sessionList"></div>
        <div class="sidebar-item" id="navCurrent">
            <span class="dot" style="background:#3b82f6"></span> 当前对话
        </div>
        <div class="sidebar-item" id="navNew">
            <span class="dot" style="background:#6e7681"></span> 新建对话
        </div>
        <div class="sidebar-section-title" style="margin-top:16px">知识库</div>
        <div class="sidebar-item" id="navUpload">
            <span class="dot" style="background:#16a34a"></span> 上传文档
        </div>
        <div class="sidebar-item" id="navIndex">
            <span class="dot" style="background:#d29922"></span> 文档索引
        </div>
        <div class="sidebar-section-title" style="margin-top:16px">设置</div>
        <div class="sidebar-item" id="navSettings">
            <span class="dot" style="background:#6e7681"></span> 系统设置
        </div>
    </div>
    <div id="sidebar-footer">
        <div class="avatar">W</div>
        <span>WorkBuddy 模式</span>
    </div>
</div>

<div id="main">
<div id="topbar">
    <div class="title">掌柜智库 · 知识库问答<small>检索链路 · SSE 流式</small></div>
    <div class="right">
        <span><span id="connDot"></span><span id="connText">未连接</span></span>
        <label class="switch"><input type="checkbox" id="streamToggle" checked>流式输出</label>
        <button class="tbtn" id="themeBtn">切换主题</button>
        <button class="tbtn" id="clearBtn">清空历史</button>
    </div>
</div>

<div id="chat">
    <div id="chatInner">
        <div id="welcome">
            <div class="logo">智</div>
            <h1>掌柜智库 · 知识库问答</h1>
            <p>检索链路驱动 · SSE 流式输出<br>输入问题开始对话，或点击下方示例快速体验</p>
            <div class="examples">
                <button class="example-btn">知识库里有哪些文档？</button>
                <button class="example-btn">帮我找一下产品相关的资料</button>
                <button class="example-btn">检索并总结最近的文档内容</button>
                <button class="example-btn">介绍一下知识库的核心概念</button>
            </div>
        </div>
    </div>
</div>

<div id="composer">
    <div id="filePreview" class="file-preview"></div>
    <div id="quickBar">
        <button class="quick-btn" id="quickUpload">上传文档</button>
        <button class="quick-btn" id="quickClear">清除上下文</button>
    </div>
    <div id="composerInner">
        <input type="file" id="fileInput" hidden multiple accept=".pdf,.md,.markdown,.png,.jpg,.jpeg,.gif,.bmp,.webp">
        <textarea id="queryInput" rows="1" placeholder="输入问题，Enter 发送，Shift+Enter 换行；支持拖拽/粘贴文件"></textarea>
        <button id="uploadFileBtn" title="选择文件上传到知识库（可多选，也可拖拽或粘贴图片）">上传</button>
        <button id="sendBtn">发送</button>
    </div>
    <div class="hint">提示：勾选「流式输出」可看到打字机效果与实时进度；取消则为一次性返回。</div>
</div>
</div>

<div id="modalMask">
    <div id="modal">
        <div id="modalHead"><h3 id="modalTitle">弹窗</h3><button id="modalClose">&times;</button></div>
        <div id="modalBody"></div>
    </div>
</div>
<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const API = '';                       // 同源部署：query 服务 127.0.0.1:8011，留空即可
const IMPORT_URL = 'http://127.0.0.1:8010/import.html';   // 上传文档服务真实路由
const UPLOAD_URL = 'http://127.0.0.1:8010/upload';        // 文件上传入库接口
const ATTU_URL   = 'http://127.0.0.1:8000';               // Milvus 可视化控制台（Attu）

let sessionId = localStorage.getItem('kb_session_id') || ('s_' + Date.now());
localStorage.setItem('kb_session_id', sessionId);

let es = null;            // EventSource 实例
let botBubble = null;     // 当前正在填充的系统气泡
let botText = '';         // 已累积的文本
let progressBox = null;   // 进度面板
let streaming = false;

/* ================= 工具函数 ================= */
function toast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove('show'), 2600);
}

function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function copyText(text, btn) {
    const done = () => {
        if (btn) { btn.textContent = '已复制'; btn.classList.add('copied'); setTimeout(() => { btn.textContent = '复制'; btn.classList.remove('copied'); }, 1500); }
        toast('已复制到剪贴板');
    };
    const fallback = () => {
        const ta = document.createElement('textarea');
        ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); done(); } catch (e) { toast('复制失败，请手动复制'); }
        document.body.removeChild(ta);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(fallback);
    } else { fallback(); }
}

/* ================= 轻量 Markdown 渲染（内联实现，无外部依赖） ================= */
function renderMarkdown(src) {
    const esc = escapeHtml(src);
    const blocks = esc.split(/```/);
    let out = '';
    for (let i = 0; i < blocks.length; i++) {
        if (i % 2 === 1) {
            // 代码块：首行可能是语言标识
            const codeLines = blocks[i].split('\n');
            let code = codeLines;
            if (codeLines[0] && !/^\s*$/.test(codeLines[0]) && !/^[a-zA-Z0-9_+-]+\s*$/.test(codeLines[0])) {
                // 第一行不是纯语言名，保留
            } else if (codeLines.length > 1 && /^[a-zA-Z0-9_+-]+\s*$/.test(codeLines[0])) {
                code = codeLines.slice(1); // 丢弃语言标识行
            }
            out += '<pre><code>' + code.join('\n') + '</code><button class="copy-code">复制代码</button></pre>';
        } else {
            out += renderInline(blocks[i]);
        }
    }
    return out;
}

function renderInline(seg) {
    // 分段：按空行拆为段落
    const paras = seg.split(/\n{2,}/);
    let html = '';
    for (const p of paras) {
        const lines = p.split('\n');
        let inList = null; let listHtml = '';
        const flushList = () => { if (inList) { html += (inList === 'ul' ? '<ul>' : '<ol>') + listHtml + '</ul>'; listHtml = ''; inList = null; } };
        for (const raw of lines) {
            const line = raw.trim();
            if (!line) { flushList(); continue; }
            let m;
            if ((m = line.match(/^#{1,3}\s+(.*)$/))) {
                flushList();
                const lv = m[0].split(' ')[0].length;
                html += `<h${lv}>${mdSpan(m[1])}</h${lv}>`;
            } else if ((m = line.match(/^[-*]\s+(.*)$/))) {
                if (inList !== 'ul') { flushList(); inList = 'ul'; }
                listHtml += `<li>${mdSpan(m[1])}</li>`;
            } else if ((m = line.match(/^\d+[.)]\s+(.*)$/))) {
                if (inList !== 'ol') { flushList(); inList = 'ol'; }
                listHtml += `<li>${mdSpan(m[1])}</li>`;
            } else if ((m = line.match(/^&gt;\s?(.*)$/))) {
                flushList(); html += `<blockquote>${mdSpan(m[1])}</blockquote>`;
            } else if (/^(-{3,}|\*{3,}|_{3,})$/.test(line)) {
                flushList(); html += '<hr>';
            } else {
                flushList(); html += `<p>${mdSpan(line)}</p>`;
            }
        }
        flushList();
    }
    return html;
}

function mdSpan(s) {
    // 行内：先保护行内代码，再做粗体/斜体/链接
    const codes = [];
    s = s.replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return '\u0000' + (codes.length - 1) + '\u0000'; });
    s = s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
    s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<i>$2</i>');
    s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    // 引用标记 [1] → 可点击的角标（放在链接替换之后，避免误伤 [text](url) 语法）
    s = s.replace(/\[(\d{1,3})\]/g, '<sup class="cite" data-n="$1">[$1]</sup>');
    s = s.replace(/\u0000(\d+)\u0000/g, (_, n) => `<code>${codes[+n]}</code>`);
    return s;
}

/* ================= 渲染辅助 ================= */
function setConn(state, text) {
    $('connDot').className = state;
    $('connText').textContent = text;
}

function scrollBottom() { const c = $('chat'); c.scrollTop = c.scrollHeight; }

function hideWelcome() {
    const w = $('welcome');
    if (w) w.remove();
}

function showWelcome() {
    if (!$('welcome')) {
        $('chatInner').innerHTML = '';
        const w = document.createElement('div');
        w.id = 'welcome';
        w.innerHTML = `
            <div class="logo">智</div>
            <h1>掌柜智库 · 知识库问答</h1>
            <p>检索链路驱动 · SSE 流式输出<br>输入问题开始对话，或点击下方示例快速体验</p>
            <div class="examples">
                <button class="example-btn">知识库里有哪些文档？</button>
                <button class="example-btn">帮我找一下产品相关的资料</button>
                <button class="example-btn">检索并总结最近的文档内容</button>
                <button class="example-btn">介绍一下知识库的核心概念</button>
            </div>`;
        $('chatInner').appendChild(w);
        w.querySelectorAll('.example-btn').forEach(b => b.addEventListener('click', () => sendText(b.textContent)));
    }
}

function addUserBubble(text) {
    hideWelcome();
    const d = document.createElement('div');
    d.className = 'msg user';
    const row = document.createElement('div');
    row.className = 'bubble-row';
    const b = document.createElement('div');
    b.className = 'bubble';
    b.textContent = text;
    const tools = document.createElement('div');
    tools.className = 'msg-tools';
    const cb = document.createElement('button');
    cb.className = 'copy-btn'; cb.textContent = '复制';
    cb.addEventListener('click', () => copyText(text, cb));
    tools.appendChild(cb);
    row.appendChild(b); row.appendChild(tools);
    d.appendChild(row);
    $('chatInner').appendChild(d);
    scrollBottom();
}

function addBotMessage(text, opts = {}) {
    hideWelcome();
    const d = document.createElement('div');
    d.className = 'msg bot';
    const av = document.createElement('div');
    av.className = 'avatar'; av.textContent = '智';
    const wrap = document.createElement('div');
    wrap.style.maxWidth = '70%';
    const b = document.createElement('div');
    b.className = 'bubble' + (opts.thinking ? ' thinking' : '') + (opts.error ? ' error' : '');
    b.innerHTML = renderMarkdown(text);
    if (opts.images && opts.images.length) {
        const imgs = document.createElement('div');
        imgs.className = 'imgs';
        for (const u of opts.images) {
            const img = document.createElement('img');
            img.src = u; img.loading = 'lazy';
            img.onerror = () => img.remove();
            imgs.appendChild(img);
        }
        b.appendChild(imgs);
    }
    // 引用溯源（P0-1）：历史回看 / 即时回答都走同一处渲染
    if (opts.sources && opts.sources.length) appendSources(wrap, opts.sources);
    const tools = document.createElement('div');
    tools.className = 'msg-tools';
    const cb = document.createElement('button');
    cb.className = 'copy-btn'; cb.textContent = '复制';
    cb.addEventListener('click', () => copyText(text, cb));
    tools.appendChild(cb);
    wrap.appendChild(b); wrap.appendChild(tools);
    d.appendChild(av); d.appendChild(wrap);
    $('chatInner').appendChild(d);
    scrollBottom();
    return { d, b };
}

/* ================= 引用溯源（P0-1） ================= */
const SRC_COLLAPSE_LIMIT = 5;   // 默认展开条数，超出折叠

function renderSourcesHtml(sources) {
    const total = sources.length;
    let h = `<div class="src-head">参考来源 ${total} 条（正文 [n] 可点击定位）</div>`;
    sources.forEach((s, i) => {
        const badge = s.source === 'web'
            ? '<span class="src-badge">联网</span>'
            : '<span class="src-badge">知识库</span>';
        const metas = [];
        if (s.file_title) metas.push(escapeHtml(s.file_title));
        if (s.chunk_id) metas.push('chunk ' + escapeHtml(String(s.chunk_id).slice(0, 10)));
        if (s.score) metas.push('score ' + s.score);
        const titleHtml = s.url
            ? `<a href="${escapeHtml(s.url)}" target="_blank" rel="noopener">${escapeHtml(s.title || s.url)}</a>`
            : escapeHtml(s.title || '未命名来源');
        const hidden = i >= SRC_COLLAPSE_LIMIT ? ' data-folded="1" style="display:none"' : '';
        h += `<div class="src-item" data-n="${s.id}"${hidden}>`
           + `<span class="src-idx">[${s.id}]</span> <span class="src-title">${titleHtml}</span>${badge}`
           + (metas.length ? `<div class="src-meta">${metas.join(' · ')}</div>` : '')
           + (s.snippet ? `<div class="src-snip">${escapeHtml(s.snippet)}</div>` : '')
           + '</div>';
    });
    if (total > SRC_COLLAPSE_LIMIT) {
        h += `<button class="src-more" data-open="0">展开全部 ${total} 条</button>`;
    }
    return h;
}

function appendSources(wrap, sources) {
    if (!wrap || !sources || !sources.length) return null;
    let box = wrap.querySelector('.sources');
    if (!box) {
        box = document.createElement('div');
        box.className = 'sources';
        wrap.appendChild(box);
    }
    box.innerHTML = renderSourcesHtml(sources);
    return box;
}

// 展开/收起来源列表
function toggleSources(box, open) {
    if (!box) return;
    const items = box.querySelectorAll('.src-item[data-folded]');
    items.forEach(x => { x.style.display = open ? '' : 'none'; });
    const btn = box.querySelector('.src-more');
    if (btn) {
        btn.dataset.open = open ? '1' : '0';
        btn.textContent = open ? '收起' : `展开全部 ${box.querySelectorAll('.src-item').length} 条`;
    }
}

// 点正文角标 → 高亮并滚动到对应来源项
document.addEventListener('click', e => {
    const more = e.target.closest('.src-more');
    if (more) {
        toggleSources(more.closest('.sources'), more.dataset.open !== '1');
        return;
    }
    const sup = e.target.closest('sup.cite');
    if (!sup) return;
    const msg = sup.closest('.msg');
    const box = msg && msg.querySelector('.sources');
    if (!box) { toast('该引用暂无来源信息'); return; }
    const item = box.querySelector(`.src-item[data-n="${sup.dataset.n}"]`);
    if (!item) { toast('该引用暂无来源信息'); return; }
    if (item.style.display === 'none') toggleSources(box, true);
    box.querySelectorAll('.src-item.hl').forEach(x => x.classList.remove('hl'));
    item.classList.add('hl');
    item.scrollIntoView({ behavior: 'smooth', block: 'center' });
    sup.classList.add('hl');
    setTimeout(() => sup.classList.remove('hl'), 1200);
});

function ensureBotBubble() {
    if (botBubble && document.body.contains(botBubble)) return botBubble;
    const { b } = addBotMessage('正在思考...', { thinking: true });
    botBubble = b;
    botText = '';
    return botBubble;
}

function renderAnswer(text) {
    const b = ensureBotBubble();
    b.classList.remove('thinking');
    botText += text;
    b.innerHTML = renderMarkdown(botText);
    scrollBottom();
}

function renderFinalAnswer() {
    if (!botBubble || !document.body.contains(botBubble)) return;
    botBubble.classList.remove('thinking');
    botBubble.innerHTML = renderMarkdown(botText);
    scrollBottom();
}

/* ================= 进度面板 ================= */
const NODE_ORDER = [
    'node_item_name_confirm', 'node_search_embedding', 'node_search_embedding_hyde',
    'node_web_search_mcp', 'node_rrf', 'node_rerank', 'node_answer_output'
];

function ensureProgressBox() {
    if (progressBox && document.body.contains(progressBox)) return progressBox;
    const box = document.createElement('div');
    box.className = 'progress-box';
    box.innerHTML = `
        <div class="progress-head"><span>处理进度</span><span class="arrow">▼</span></div>
        <div class="progress-body"></div>`;
    box.querySelector('.progress-head').onclick = () => {
        const body = box.querySelector('.progress-body');
        body.style.display = body.style.display === 'none' ? 'block' : 'none';
    };
    ensureBotBubble().appendChild(box);
    progressBox = box;
    scrollBottom();
    return box;
}

function updateProgress(done, running, failed) {
    const box = ensureProgressBox();
    const body = box.querySelector('.progress-body');
    body.style.display = 'block';
    let html = '';
    for (const name of NODE_ORDER) {
        let cls = 'wait', txt = '等待中';
        if ((failed || []).includes(name)) { cls = 'err'; txt = '失败'; }
        else if ((done || []).includes(name)) { cls = 'ok'; txt = '完成'; }
        else if ((running || []).includes(name)) { cls = 'run'; txt = '执行中...'; }
        html += `<div class="row"><span class="nm">${name}</span><span class="${cls}">${txt}</span></div>`;
    }
    body.innerHTML = html;
    scrollBottom();
}

/* ================= SSE 连接 ================= */
function connectSSE(sid) {
    if (es) { es.close(); es = null; }
    es = new EventSource(`${API}/stream/${sid}`);
    es.addEventListener('ready', e => {
        setConn('busy', '已连接');
    });
    es.addEventListener('progress', e => {
        const d = JSON.parse(e.data);
        updateProgress(d.done_list, d.running_list, d.failed_list);
    });
    es.addEventListener('delta', e => {
        const d = JSON.parse(e.data);
        renderAnswer(d.delta || d.text || '');
    });
    es.addEventListener('final', e => {
        const d = JSON.parse(e.data);
        if (d.answer && !botText) renderAnswer(d.answer);
        if (d.image_urls && d.image_urls.length) {
            const wrap = document.createElement('div');
            wrap.className = 'imgs';
            for (const u of d.image_urls) {
                const img = document.createElement('img');
                img.src = u; img.loading = 'lazy';
                img.onerror = () => img.remove();
                wrap.appendChild(img);
            }
            if (botBubble && document.body.contains(botBubble)) botBubble.appendChild(wrap);
        }
        renderFinalAnswer();
        // 引用溯源（P0-1）：FINAL 事件带回来源清单，挂在气泡下方
        if (d.sources && d.sources.length && botBubble && botBubble.parentNode) {
            appendSources(botBubble.parentNode, d.sources);
            scrollBottom();
        }
        finishStream('completed');
    });
    es.addEventListener('error', e => {
        if (e.data) {
            try {
                const d = JSON.parse(e.data);
                renderAnswer('\n[错误] ' + (d.error || '未知错误'));
            } catch (_) {}
        }
        finishStream('failed');
    });
    es.onerror = () => {
        if (streaming) setConn('', '连接中断');
    };
}

function finishStream(status) {
    streaming = false;
    $('sendBtn').disabled = false;
    $('sendBtn').innerHTML = '发送';
    setConn('on', status === 'completed' ? '已连接' : status === 'failed' ? '已断开' : '');
    if (es) { es.close(); es = null; }
    if (progressBox && document.body.contains(progressBox)) {
        const head = progressBox.querySelector('.progress-head span');
        head.textContent = status === 'completed' ? '完成' : status === 'failed' ? '失败' : '执行中...';
    }
}

/* ================= 会话列表（localStorage 记忆 + 点击加载 /history/{sid}） ================= */
const SESSION_KEY = 'kb_sessions';
function loadSessions() {
    try { return JSON.parse(localStorage.getItem(SESSION_KEY) || '[]'); } catch (e) { return []; }
}
function saveSessions(list) { localStorage.setItem(SESSION_KEY, JSON.stringify(list.slice(0, 30))); }

function upsertSession(sid, title) {
    const list = loadSessions();
    const idx = list.findIndex(s => s.sid === sid);
    const ts = Date.now();
    if (idx >= 0) {
        list[idx].ts = ts;
        if (title) list[idx].title = title;
    } else {
        list.unshift({ sid, title: title || '新对话', ts });
    }
    saveSessions(list);
    renderSessionList();
}

function renderSessionList() {
    const box = $('sessionList');
    const list = loadSessions();
    if (!list.length) {
        box.innerHTML = '<div id="sessionEmpty">暂无历史会话</div>';
        return;
    }
    box.innerHTML = '';
    for (const s of list) {
        const it = document.createElement('div');
        it.className = 'session-item' + (s.sid === sessionId ? ' active' : '');
        const time = new Date(s.ts);
        const timeStr = time.getHours() + ':' + String(time.getMinutes()).padStart(2, '0');
        it.innerHTML = `<span class="st">${escapeHtml(s.title)}</span><span class="sx" title="删除该会话">×</span>`;
        it.querySelector('.st').addEventListener('click', () => switchSession(s.sid));
        it.querySelector('.sx').addEventListener('click', e => {
            e.stopPropagation();
            const list2 = loadSessions().filter(x => x.sid !== s.sid);
            saveSessions(list2);
            renderSessionList();
            toast('已从列表移除（本地记录）');
        });
        it.title = timeStr;
        box.appendChild(it);
    }
}

let navBusy = false;   // 会话切换/新建防抖，避免加载历史期间重复点击
async function switchSession(sid) {
    if (navBusy) { toast('正在加载会话，请稍候'); return; }
    navBusy = true;
    if (sid === sessionId) { navBusy = false; switchToCurrent(); return; }
    sessionId = sid;
    localStorage.setItem('kb_session_id', sid);
    resetChatUI();
    await loadHistory(sid);
    renderSessionList();
    setConn('on', '已连接');
    navBusy = false;
}

async function switchToCurrent() {
    if (navBusy) { toast('正在加载会话，请稍候'); return; }
    navBusy = true;
    const cur = localStorage.getItem('kb_session_id') || sessionId;
    sessionId = cur;
    localStorage.setItem('kb_session_id', cur);
    resetChatUI();
    await loadHistory(cur);
    renderSessionList();
    navBusy = false;
}

async function newConversation() {
    if (navBusy) { toast('正在加载会话，请稍候'); return; }
    navBusy = true;
    sessionId = 's_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);
    localStorage.setItem('kb_session_id', sessionId);
    resetChatUI();
    upsertSession(sessionId);
    showWelcome();
    setConn('on', '已连接');
    navBusy = false;
}

function resetChatUI() {
    $('chatInner').innerHTML = '';
    botBubble = null; botText = ''; progressBox = null;
    if (es) { es.close(); es = null; }
    streaming = false;
    $('sendBtn').disabled = false;
    $('sendBtn').innerHTML = '发送';
}

/* ================= 历史加载（GET /history/{session_id}） ================= */
async function loadHistory(sid) {
    // 加载中提示（仅在聊天区为空时展示）
    const hint = document.createElement('div');
    hint.className = 'msg bot loading-hint';
    hint.innerHTML = '<div class="avatar">智</div><div style="max-width:70%"><div class="bubble thinking">正在加载历史...</div></div>';
    if (!$('chatInner').children.length) $('chatInner').appendChild(hint);
    try {
        const r = await fetch(`${API}/history/${sid}?limit=100`);
        if (!r.ok) { showWelcome(); return; }
        const d = await r.json();
        const items = d.items || [];
        if (!items.length) { showWelcome(); return; }
        hideWelcome();
        for (const it of items) {
            if (it.role === 'user' || it.role === 'human') {
                addUserBubble(it.text || '');
            } else if (it.role === 'assistant' || it.role === 'ai' || it.role === 'bot') {
                addBotMessage(it.text || '（无文本）', { images: it.image_urls || [], sources: it.sources || [] });
            }
        }
        scrollBottom();
    } catch (e) {
        showWelcome();
        console.warn('加载历史失败', e);
    } finally {
        const h = $('chatInner').querySelector('.loading-hint');
        if (h) h.remove();
    }
}

/* 兼容入口：旧调用点（navUpload/quickUpload）改为打开当前页上传引导 */
function goImportPage() { openUploadModal(); }

/* ================= 主题切换 ================= */
function applyTheme(light) {
    document.body.classList.toggle('theme-light', light);
    $('themeBtn').textContent = light ? '切换深色' : '切换浅色';
    localStorage.setItem('kb_theme', light ? 'light' : 'dark');
}
function toggleTheme() {
    applyTheme(!document.body.classList.contains('theme-light'));
}

/* ================= 发送消息 ================= */
function sendText(text) {
    const input = $('queryInput');
    input.value = text;
    sendMessage();
}

async function sendMessage() {
    const input = $('queryInput');
    const text = input.value.trim();
    if (uploadingFiles) { toast('正在上传文件，请稍候'); return; }
    if (navBusy) { toast('正在加载会话历史，请稍候再发送'); return; }
    // 有待上传文件：先上传到知识库（8010 /upload），成功后再发送文本
    if (pendingFiles.length) {
        const up = await uploadPendingFiles();
        if (!up.uploaded && !text) return;
        if (up.uploaded) toast('文件已上传，可在知识库中检索');
    }
    if (!text || streaming) return;
    const hint = document.querySelector('.loading-hint'); if (hint) hint.remove();
    input.value = '';
    input.style.height = 'auto';
    upsertSession(sessionId, text.slice(0, 22));
    addUserBubble(text);
    ensureBotBubble();
    streaming = true;
    $('sendBtn').disabled = true;
    $('sendBtn').innerHTML = '<span class="spinner"></span>发送中';

    fetch(`${API}/query`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            query: text,
            session_id: sessionId,
            is_stream: $('streamToggle').checked
        })
    }).then(r => r.json()).then(d => {
        if (d.error) {
            renderAnswer('\n[错误] ' + d.error);
            finishStream('failed');
            return;
        }
        connectSSE(d.session_id);
    }).catch(e => {
        renderAnswer('\n[错误] 网络请求失败: ' + e.message);
        finishStream('failed');
    });
}

/* ================= 文件上传到知识库（POST 8010/upload） ================= */
let pendingFiles = [];
let uploadingFiles = false;
const MAX_FILE_MB = 100;
const ACCEPT_EXT = new Set(['.pdf', '.md', '.markdown', '.png', '.jpg', '.jpeg', '.gif', '.bmp', '.webp']);
const DOC_EXT = new Set(['.pdf', '.md', '.markdown']);
function fileExt(name) { return '.' + (name.split('.').pop() || '').toLowerCase(); }
function fmtSize(b) {
    if (b >= 1048576) return (b / 1048576).toFixed(1) + ' MB';
    if (b >= 1024) return (b / 1024).toFixed(1) + ' KB';
    return b + ' B';
}
function handleFiles(fileList) {
    if (!fileList || !fileList.length) return;
    for (const f of Array.from(fileList)) {
        const ext = fileExt(f.name);
        if (!ACCEPT_EXT.has(ext)) { toast('不支持类型 ' + ext + '，仅支持 PDF / MD / Markdown 与常见图片'); continue; }
        if (f.size > MAX_FILE_MB * 1048576) { toast(f.name + ' 超过 100MB 限制，已跳过'); continue; }
        pendingFiles.push(f);
    }
    renderPreview();
}
function renderPreview() {
    const box = $('filePreview');
    box.innerHTML = '';
    pendingFiles.forEach((f, i) => {
        const it = document.createElement('div');
        it.className = 'fp-item';
        const ext = fileExt(f.name);
        if (f.type.startsWith('image/')) {
            const img = document.createElement('img');
            img.className = 'fp-thumb';
            img.src = URL.createObjectURL(f);
            img.alt = f.name;
            it.appendChild(img);
        } else {
            const ico = document.createElement('span');
            ico.className = 'fp-ico';
            ico.textContent = ext.toUpperCase().replace('.', '').slice(0, 4);
            it.appendChild(ico);
        }
        const info = document.createElement('div');
        info.className = 'fp-info';
        const nm = document.createElement('span'); nm.className = 'fp-name'; nm.title = f.name; nm.textContent = f.name;
        const sz = document.createElement('span'); sz.className = 'fp-size'; sz.textContent = fmtSize(f.size);
        info.appendChild(nm); info.appendChild(sz);
        const del = document.createElement('button');
        del.className = 'fp-del'; del.title = '移除该文件'; del.textContent = '×';
        del.addEventListener('click', () => { pendingFiles.splice(i, 1); renderPreview(); });
        it.appendChild(info); it.appendChild(del);
        box.appendChild(it);
    });
}
async function uploadPendingFiles() {
    if (!pendingFiles.length) return { uploaded: false };
    if (uploadingFiles) { toast('正在上传中，请稍候'); return { uploaded: false, busy: true }; }
    // 后端契约：至少一个主文档（PDF/MD），纯图片仅作附属会被 400 拒绝
    if (!pendingFiles.some(f => DOC_EXT.has(fileExt(f.name)))) {
        toast('上传需包含至少一个文档（PDF / MD / Markdown），图片只能作为附属文件');
        return { uploaded: false };
    }
    uploadingFiles = true;
    const fd = new FormData();
    for (const f of pendingFiles) fd.append('files', f, f.name);
    const status = document.createElement('div');
    status.id = 'uploadStatus';
    status.textContent = '正在上传 ' + pendingFiles.length + ' 个文件到知识库...';
    $('filePreview').after(status);
    $('sendBtn').disabled = true;
    $('sendBtn').textContent = '上传中...';
    try {
        const r = await fetch(UPLOAD_URL, { method: 'POST', body: fd });
        let j = null;
        try { j = await r.json(); } catch (e) { j = null; }
        if (!r.ok) throw new Error((j && j.detail) || ('HTTP ' + r.status));
        pendingFiles = [];
        renderPreview();
        showUploadResult(j);
        return { uploaded: true, result: j };
    } catch (e) {
        toast('上传失败：' + e.message);
        return { uploaded: false, error: e };
    } finally {
        uploadingFiles = false;
        const st = $('uploadStatus'); if (st) st.remove();
        $('sendBtn').disabled = false;
        $('sendBtn').textContent = '发送';
    }
}
function showUploadResult(j) {
    const ids = (j.task_ids || []).map(id => '<li><code>' + escapeHtml(id) + '</code></li>').join('');
    const okCount = (j.details || []).filter(d => d.accepted !== false).length;
    const bad = (j.details || []).filter(d => d.accepted === false);
    const badHtml = bad.map(d => '<li>' + escapeHtml(d.filename) + '：' + escapeHtml(d.reason || '未接受') + '</li>').join('');
    const total = (j.task_ids || []).length + okCount;
    const body =
        '<div class="mtitle">上传完成</div>' +
        '<p>共受理 ' + total + ' 个文件，生成任务 ' + (j.task_ids || []).length + ' 个</p>' +
        (ids ? '<div class="mtitle">task_ids</div><ul>' + ids + '</ul>' : '') +
        (badHtml ? '<div class="mtitle" style="color:var(--danger,#f66)">未接受的文件</div><ul>' + badHtml + '</ul>' : '') +
        '<p style="color:var(--text2,#999);font-size:12px">' + escapeHtml(j.message || '') + '</p>';
    openModal('上传完成', body);
}

/* ================= 清除上下文 ================= */
let clearBusy = false;
async function clearHistory() {
    if (clearBusy) return;               // 防重复点击
    clearBusy = true;
    try {
        const r = await fetch(`${API}/history/${sessionId}`, { method: 'DELETE' });
        if (!r.ok) toast('清空失败：HTTP ' + r.status);
        else toast('上下文已清除');
    } catch (e) {
        toast('清空失败：' + (e && e.message ? e.message : '网络错误'));
    }
    resetChatUI();
    showWelcome();
    clearBusy = false;
}

/* ================= 初始化 ================= */
document.addEventListener('DOMContentLoaded', () => {
    // 主题恢复
    const savedTheme = localStorage.getItem('kb_theme');
    applyTheme(savedTheme === 'light');

    renderSessionList();

    // 发送
    $('sendBtn').addEventListener('click', sendMessage);
    $('queryInput').addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });
    $('queryInput').addEventListener('input', function () {
        this.style.height = 'auto';
        this.style.height = Math.min(this.scrollHeight, 140) + 'px';
    });

    // 顶部栏
    $('clearBtn').addEventListener('click', clearHistory);
    $('themeBtn').addEventListener('click', toggleTheme);

    // 输入区快捷按钮
    $('quickUpload').addEventListener('click', goImportPage);
    $('quickClear').addEventListener('click', clearHistory);

    // 文件上传：选择文件 / 拖拽 / 粘贴
    $('uploadFileBtn').addEventListener('click', () => $('fileInput').click());
    $('fileInput').addEventListener('change', e => {
        handleFiles(e.target.files);
        e.target.value = '';
    });
    const composerBox = $('composer');
    ['dragenter', 'dragover'].forEach(ev => composerBox.addEventListener(ev, e => {
        e.preventDefault();
        composerBox.classList.add('dragover');
    }));
    composerBox.addEventListener('dragleave', e => {
        if (!composerBox.contains(e.relatedTarget)) composerBox.classList.remove('dragover');
    });
    composerBox.addEventListener('drop', e => {
        e.preventDefault();
        composerBox.classList.remove('dragover');
        if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);
    });
    $('queryInput').addEventListener('paste', e => {
        const pf = e.clipboardData && e.clipboardData.files;
        if (pf && pf.length) {
            const imgs = Array.from(pf).filter(f => f.type.startsWith('image/'));
            if (imgs.length) { e.preventDefault(); handleFiles(imgs); }
        }
    });

    // 侧边栏
    $('navCurrent').addEventListener('click', switchToCurrent);
    $('navNew').addEventListener('click', newConversation);
    $('navUpload').addEventListener('click', goImportPage);
    $('navIndex').addEventListener('click', openIndexModal);
    $('navSettings').addEventListener('click', openSettingsModal);

    // 弹窗关闭
    $('modalClose').addEventListener('click', closeModal);
    $('modalMask').addEventListener('click', e => { if (e.target === $('modalMask')) closeModal(); });

    // 代码块复制按钮（事件委托）
    document.addEventListener('click', e => {
        const btn = e.target.closest('.copy-code');
        if (btn) {
            const code = btn.parentElement.querySelector('code');
            if (code) copyText(code.innerText, btn);
        }
    });

    // 欢迎页示例问题
    document.querySelectorAll('#welcome .example-btn').forEach(b => b.addEventListener('click', () => sendText(b.textContent)));

    // 启动时连接当前会话 SSE（仅当有历史时加载）
    loadHistory(sessionId).then(() => {
        // 有历史消息时保持连接；无历史时显示欢迎页
    });

    // 首次打开若无历史，保持欢迎页
    setConn('on', '已连接');
});
</script>
