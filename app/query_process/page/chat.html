<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>掌柜智库 · 知识库问答</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: -apple-system, "Microsoft YaHei", "Segoe UI", sans-serif;
        background: #f5f6f8; color: #2c3e50;
        height: 100vh; display: flex; flex-direction: column;
    }

    /* ---- 顶栏 ---- */
    #topbar {
        background: #fff; border-bottom: 1px solid #e8eaed;
        padding: 12px 24px; display: flex; align-items: center;
        justify-content: space-between; flex-shrink: 0;
    }
    #topbar .title { font-size: 16px; font-weight: 600; }
    #topbar .title small { font-weight: 400; color: #95a5a6; margin-left: 8px; font-size: 12px; }
    #topbar .right { display: flex; align-items: center; gap: 14px; }
    #connDot {
        width: 8px; height: 8px; border-radius: 50%;
        background: #bdc3c7; display: inline-block; margin-right: 5px;
    }
    #connDot.on { background: #27ae60; }
    #connDot.busy { background: #f39c12; }
    #connText { font-size: 12px; color: #7f8c8d; }
    .switch { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #7f8c8d; cursor: pointer; }
    .switch input { cursor: pointer; }
    #clearBtn {
        border: 1px solid #dfe3e8; background: #fff; color: #7f8c8d;
        padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 12px;
    }
    #clearBtn:hover { border-color: #e74c3c; color: #e74c3c; }

    /* ---- 对话区 ---- */
    #chat { flex: 1; overflow-y: auto; padding: 24px 20px; }
    #chatInner { max-width: 860px; margin: 0 auto; }
    .msg { margin-bottom: 18px; display: flex; }
    .msg.user { justify-content: flex-end; }
    .bubble {
        max-width: 72%; padding: 12px 16px; border-radius: 12px;
        line-height: 1.75; font-size: 14.5px; white-space: pre-wrap; word-break: break-word;
    }
    .msg.user .bubble { background: #4a90d9; color: #fff; border-bottom-right-radius: 3px; }
    .msg.bot .bubble {
        background: #fff; color: #2c3e50;
        border: 1px solid #e8eaed; border-bottom-left-radius: 3px;
    }
    .msg.bot .bubble.thinking { color: #95a5a6; font-style: italic; }
    .imgs { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
    .imgs img { max-width: 150px; border-radius: 8px; border: 1px solid #e8eaed; }

    /* ---- 进度折叠面板 ---- */
    .progress-box {
        margin-top: 10px; border: 1px solid #e8eaed; border-radius: 8px;
        background: #fafbfc; overflow: hidden;
    }
    .progress-head {
        padding: 8px 12px; font-size: 12.5px; color: #7f8c8d;
        cursor: pointer; user-select: none; display: flex;
        align-items: center; justify-content: space-between;
    }
    .progress-head:hover { background: #f2f4f6; }
    .progress-body { padding: 4px 12px 10px; border-top: 1px solid #eef1f4; }
    .progress-body .row { display: flex; gap: 10px; font-size: 12px; line-height: 1.9; font-family: Consolas, monospace; }
    .progress-body .nm { min-width: 190px; }
    .ok { color: #27ae60; } .run { color: #f39c12; } .wait { color: #bdc3c7; } .err { color: #e74c3c; }

    /* ---- 输入区 ---- */
    #composer {
        background: #fff; border-top: 1px solid #e8eaed; padding: 14px 20px;
        flex-shrink: 0;
    }
    #composerInner { max-width: 860px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
    #queryInput {
        flex: 1; border: 1px solid #dfe3e8; border-radius: 10px;
        padding: 11px 14px; font-size: 14.5px; resize: none;
        font-family: inherit; line-height: 1.6; max-height: 140px; outline: none;
    }
    #queryInput:focus { border-color: #4a90d9; }
    #sendBtn {
        background: #4a90d9; color: #fff; border: none; border-radius: 10px;
        padding: 11px 22px; font-size: 14.5px; cursor: pointer; white-space: nowrap;
    }
    #sendBtn:hover { background: #357abd; }
    #sendBtn:disabled { background: #bdc3c7; cursor: not-allowed; }
    .hint { max-width: 860px; margin: 8px auto 0; font-size: 11.5px; color: #bdc3c7; }
</style>
</head>
<body>

<div id="topbar">
    <div class="title">掌柜智库 · 知识库问答<small>检索链路 · SSE 流式</small></div>
    <div class="right">
        <span><span id="connDot"></span><span id="connText">未连接</span></span>
        <label class="switch"><input type="checkbox" id="streamToggle" checked>流式输出</label>
        <button id="clearBtn">清空历史</button>
    </div>
</div>

<div id="chat"><div id="chatInner"></div></div>

<div id="composer">
    <div id="composerInner">
        <textarea id="queryInput" rows="1" placeholder="输入问题，Enter 发送，Shift+Enter 换行"></textarea>
        <button id="sendBtn">发送</button>
    </div>
    <div class="hint">提示：勾选「流式输出」可看到打字机效果与实时进度；取消则为一次性返回。</div>
</div>

<script>
const $ = id => document.getElementById(id);
const API = '';                       // 同源部署，留空即可
let sessionId = localStorage.getItem('kb_session_id') || ('s_' + Date.now());
localStorage.setItem('kb_session_id', sessionId);

let es = null;                          // EventSource 实例
let botBubble = null;                   // 当前正在填充的系统气泡
let botText = '';                       // 已累积的文本
let progressBox = null;                 // 进度面板
let streaming = false;

// ---------------- 渲染辅助 ----------------
function setConn(state, text) {
    const dot = $('connDot');
    dot.className = state;
    $('connText').textContent = text;
}

function scrollBottom() {
    const c = $('chat');
    c.scrollTop = c.scrollHeight;
}

function addUserBubble(text) {
    const d = document.createElement('div');
    d.className = 'msg user';
    const b = document.createElement('div');
    b.className = 'bubble';
    b.textContent = text;
    d.appendChild(b);
    $('chatInner').appendChild(d);
    scrollBottom();
}

function ensureBotBubble() {
    if (botBubble) return botBubble;
    const d = document.createElement('div');
    d.className = 'msg bot';
    botBubble = document.createElement('div');
    botBubble.className = 'bubble thinking';
    botBubble.textContent = '正在思考...';
    d.appendChild(botBubble);
    $('chatInner').appendChild(d);
    scrollBottom();
    return botBubble;
}

function renderAnswer(text) {
    const b = ensureBotBubble();
    b.classList.remove('thinking');
    botText += text;
    b.textContent = botText;
    scrollBottom();
}

// ---------------- 进度面板 ----------------
const NODE_ORDER = [
    'node_item_name_confirm', 'node_search_embedding', 'node_search_embedding_hyde',
    'node_web_search_mcp', 'node_rrf', 'node_rerank', 'node_answer_output'
];

function ensureProgressBox() {
    if (progressBox) return progressBox;
    const box = document.createElement('div');
    box.className = 'progress-box';
    box.innerHTML = `
        <div class="progress-head"><span>处理进度</span><span class="arrow">▼</span></div>
        <div class="progress-body"></div>`;
    box.querySelector('.progress-head').onclick = () => {
        const body = box.querySelector('.progress-body');
        body.style.display = body.style.display === 'none' ? 'block' : 'none';
    };
    ensureBotBubble().appendChild(box);
    progressBox = box;
    scrollBottom();
    return box;
}

function updateProgress(done, running, failed) {
    const box = ensureProgressBox();
    const body = box.querySelector('.progress-body');
    body.style.display = 'block';
    let html = '';
    for (const name of NODE_ORDER) {
        let cls = 'wait', txt = '等待中';
        if ((failed || []).includes(name)) { cls = 'err'; txt = '失败'; }
        else if ((done || []).includes(name)) { cls = 'ok'; txt = '完成'; }
        else if ((running || []).includes(name)) { cls = 'run'; txt = '执行中...'; }
        html += `<div class="row"><span class="nm">${name}</span><span class="${cls}">${txt}</span></div>`;
    }
    body.innerHTML = html;
    scrollBottom();
}

// ---------------- SSE 连接 ----------------
function connectSSE(sid) {
    if (es) { es.close(); es = null; }

    es = new EventSource(`${API}/stream/${sid}`);

    es.addEventListener('ready', e => {
        const d = JSON.parse(e.data);
        setConn('busy', '已连接');
        console.log('SSE 握手成功, session =', d.session_id);
    });

    es.addEventListener('progress', e => {
        const d = JSON.parse(e.data);
        updateProgress(d.done_list, d.running_list, d.failed_list);
    });

    es.addEventListener('delta', e => {
        const d = JSON.parse(e.data);
        renderAnswer(d.delta || d.text || '');
    });

    es.addEventListener('final', e => {
        const d = JSON.parse(e.data);
        if (d.answer && !botText) renderAnswer(d.answer);
        if (d.image_urls && d.image_urls.length) {
            const wrap = document.createElement('div');
            wrap.className = 'imgs';
            for (const u of d.image_urls) {
                const img = document.createElement('img');
                img.src = u; img.loading = 'lazy';
                img.onerror = () => img.remove();   // 图片挂了就去掉，别留破图
                wrap.appendChild(img);
            }
            ensureBotBubble().appendChild(wrap);
        }
        finishStream('completed');
    });

    es.addEventListener('error', e => {
        // EventSource 自带重连；只有主动 close 后才会走到这里
        if (e.data) {
            try {
                const d = JSON.parse(e.data);
                renderAnswer('\n[错误] ' + (d.error || '未知错误'));
            } catch (_) {}
        }
        finishStream('failed');
    });

    es.onerror = () => {
        if (streaming) { setConn('', '连接中断'); }
    };
}

function finishStream(status) {
    streaming = false;
    $('sendBtn').disabled = false;
    if (es) { es.close(); es = null; }
    if (progressBox) {
        const head = progressBox.querySelector('.progress-head span');
        if (head) head.textContent = status === 'completed' ? '处理完成' : '处理失败';
    }
    setConn('', status === 'completed' ? '已完成' : '失败');
    scrollBottom();
}

// ---------------- 发送 ----------------
async function send() {
    const input = $('queryInput');
    const q = input.value.trim();
    if (!q || streaming) return;

    addUserBubble(q);
    input.value = '';
    input.style.height = 'auto';

    // 重置本轮状态
    botBubble = null; botText = ''; progressBox = null;
    streaming = true;
    $('sendBtn').disabled = true;
    setConn('busy', '处理中');

    const isStream = $('streamToggle').checked;
    try {
        const res = await fetch(`${API}/query`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ query: q, session_id: sessionId, is_stream: isStream })
        });
        const data = await res.json();

        if (data.session_id && data.session_id !== sessionId) {
            sessionId = data.session_id;
            localStorage.setItem('kb_session_id', sessionId);
        }

        if (isStream) {
            // 流式：立刻连 SSE，等后端推事件
            connectSSE(sessionId);
        } else {
            // 非流式：接口同步跑完，直接显示答案
            ensureBotBubble().classList.remove('thinking');
            renderAnswer(data.answer || '(无内容)');
            finishStream('completed');
        }
    } catch (err) {
        ensureBotBubble().classList.remove('thinking');
        renderAnswer('[请求失败] ' + err.message);
        finishStream('failed');
    }
}

// ---------------- 历史记录 ----------------
async function loadHistory() {
    try {
        const r = await fetch(`${API}/history/${sessionId}?limit=50`);
        const d = await r.json();
        if (!d.items || !d.items.length) return;
        $('chatInner').innerHTML = '';
        for (const it of d.items) {
            const div = document.createElement('div');
            div.className = 'msg ' + (it.role === 'user' ? 'user' : 'bot');
            const b = document.createElement('div');
            b.className = 'bubble';
            b.textContent = it.text;
            div.appendChild(b);
            $('chatInner').appendChild(div);
            if (it.image_urls && it.image_urls.length) {
                const wrap = document.createElement('div');
                wrap.className = 'imgs';
                for (const u of it.image_urls) {
                    const img = document.createElement('img');
                    img.src = u; img.loading = 'lazy'; img.onerror = () => img.remove();
                    wrap.appendChild(img);
                }
                div.querySelector('.bubble').appendChild(wrap);
            }
        }
        scrollBottom();
    } catch (e) {
        console.warn('加载历史失败', e);
    }
}

$('clearBtn').onclick = async () => {
    if (!confirm('确定清空该会话的全部历史记录？')) return;
    try {
        const r = await fetch(`${API}/history/${sessionId}`, { method: 'DELETE' });
        const d = await r.json();
        alert(`已清空 ${d.deleted_count} 条记录`);
        $('chatInner').innerHTML = '';
        // 换新会话，避免下次查询串到旧上下文
        sessionId = 's_' + Date.now();
        localStorage.setItem('kb_session_id', sessionId);
    } catch (e) {
        alert('清空失败: ' + e.message);
    }
};

// ---------------- 事件绑定 ----------------
$('sendBtn').onclick = send;
$('queryInput').onkeydown = e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
};
$('queryInput').oninput = function () {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 140) + 'px';
};

loadHistory();
</script>
</body>
</html>
