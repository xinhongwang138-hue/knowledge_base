<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>掌柜智库 · 文件导入</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: -apple-system, "Microsoft YaHei", "Segoe UI", sans-serif;
        background: #f5f6f8;
        color: #2c3e50;
        padding: 40px 20px;
    }
    .wrap { max-width: 820px; margin: 0 auto; }
    h1 { font-size: 24px; margin-bottom: 6px; }
    .sub { color: #7f8c8d; font-size: 13px; margin-bottom: 28px; }

    /* 拖拽上传区 */
    #drop {
        background: #fff;
        border: 2px dashed #bdc3c7;
        border-radius: 12px;
        padding: 48px 24px;
        text-align: center;
        cursor: pointer;
        transition: all .2s;
    }
    #drop:hover, #drop.on { border-color: #4a90d9; background: #f0f7ff; }
    #drop .icon { font-size: 44px; margin-bottom: 12px; }
    #drop .main { font-size: 16px; margin-bottom: 6px; }
    #drop .hint { font-size: 13px; color: #95a5a6; }

    /* 上传进度 */
    #up { margin-top: 20px; display: none; }
    .bar { height: 8px; background: #ecf0f1; border-radius: 4px; overflow: hidden; }
    .bar > i {
        display: block; height: 100%; width: 0;
        background: linear-gradient(90deg, #4a90d9, #6fb1e0);
        transition: width .2s;
    }
    #up .tip { font-size: 13px; color: #7f8c8d; margin-top: 8px; }

    /* 状态条 */
    #status {
        margin-top: 24px; padding: 16px 18px;
        background: #fff; border-radius: 10px;
        border-left: 4px solid #bdc3c7;
    }
    #status.pending   { border-left-color: #95a5a6; }
    #status.processing{ border-left-color: #4a90d9; }
    #status.completed { border-left-color: #27ae60; }
    #status.failed    { border-left-color: #e74c3c; }
    #status .st { font-weight: 600; font-size: 15px; }
    #status .tid {
        font-size: 12px; color: #95a5a6; margin-top: 4px;
        font-family: Consolas, Monaco, monospace; word-break: break-all;
    }

    /* 日志区 */
    #logBox { margin-top: 24px; background: #fff; border-radius: 10px; overflow: hidden; }
    #logHead {
        padding: 14px 18px; cursor: pointer; user-select: none;
        display: flex; align-items: center; justify-content: space-between;
        font-size: 14px;
    }
    #logHead .arrow { color: #95a5a6; font-size: 12px; transition: transform .2s; }
    #logBox.open #logHead .arrow { transform: rotate(90deg); }
    #log {
        max-height: 340px; overflow-y: auto; padding: 6px 18px 16px;
        border-top: 1px solid #f0f2f4; display: none;
        font-family: Consolas, Monaco, monospace; font-size: 12.5px; line-height: 1.85;
    }
    #logBox.open #log { display: block; }
    #log .row { display: flex; gap: 10px; }
    #log .nm { min-width: 210px; }
    #log .tag { min-width: 62px; }
    .tag.ok   { color: #27ae60; }
    .tag.run  { color: #f39c12; }
    .tag.wait { color: #bdc3c7; }
    .tag.err  { color: #e74c3c; }
    .cost { color: #95a5a6; }
    .tipbox {
        margin-top: 16px; padding: 12px 14px; background: #fff8e6;
        border-radius: 8px; font-size: 12.5px; color: #8a6d3b; line-height: 1.8;
    }
    code { background: #f0f2f4; padding: 1px 6px; border-radius: 4px; }
</style>
</head>
<body>
<div class="wrap">
    <h1>掌柜智库 · 文件导入</h1>
    <div class="sub">上传 PDF / MD，自动完成：转 MD → 图片摘要 → 切片 → 主体识别 → 向量化 → 入库 Milvus</div>

    <div id="drop">
        <div class="icon">📁</div>
        <div class="main">点击选择文件，或拖拽文件到此处</div>
        <div class="hint">支持 .pdf / .md，单个文件不超过 100MB，可多选</div>
        <input type="file" id="picker" multiple accept=".pdf,.md,.markdown" hidden>
    </div>

    <div id="up">
        <div class="bar"><i id="barIn"></i></div>
        <div class="tip" id="upTip"></div>
    </div>

    <div id="status" class="pending" style="display:none">
        <div class="st" id="stText">准备中...</div>
        <div class="tid" id="stTid"></div>
    </div>

    <div id="logBox">
        <div id="logHead">
            <span>日志（点击展开）</span>
            <span class="arrow">▶</span>
        </div>
        <div id="log"></div>
    </div>

    <div class="tipbox">
        导入完成后可用 Attu（<code>http://127.0.0.1:8000</code>）查看 <code>kb_chunks</code> 集合的新增数据。<br>
        完整链路耗时参考：PDF 转换 + 视觉模型摘要 + 向量化，约 10~60 秒。
    </div>
</div>

<script>
const $ = id => document.getElementById(id);
const drop = $('drop'), picker = $('picker');

// 后端节点执行顺序（用于把 done_list 渲染成有序日志）
const NODE_ORDER = [
    'upload_file', 'node_pdf_to_md', 'node_md_img', 'node_document_split',
    'node_item_name_recognition', 'node_bge_embedding', 'node_import_milvus'
];

// ---------- 选择 / 拖拽 ----------
drop.onclick = () => picker.click();
drop.ondragover = e => { e.preventDefault(); drop.classList.add('on'); };
drop.ondragleave = () => drop.classList.remove('on');
drop.ondrop = e => {
    e.preventDefault();
    drop.classList.remove('on');
    if (e.dataTransfer.files.length) upload(e.dataTransfer.files);
};
picker.onchange = () => { if (picker.files.length) upload(picker.files); };

// ---------- 上传（用 XHR 以便拿到上传进度） ----------
function upload(files) {
    const fd = new FormData();
    for (const f of files) fd.append('files', f);

    $('up').style.display = 'block';
    $('barIn').style.width = '0%';
    $('upTip').textContent = `正在上传 ${files.length} 个文件...`;

    const xhr = new XMLHttpRequest();
    xhr.open('POST', '/upload');

    xhr.upload.onprogress = e => {
        if (e.lengthComputable) {
            const pct = Math.round(e.loaded / e.total * 100);
            $('barIn').style.width = pct + '%';
            $('upTip').textContent = `上传中 ${pct}% （${formatSize(e.loaded)} / ${formatSize(e.total)}）`;
        }
    };

    xhr.onload = () => {
        $('barIn').style.width = '100%';
        if (xhr.status !== 200) {
            $('upTip').textContent = '上传失败：HTTP ' + xhr.status;
            return;
        }
        let res;
        try { res = JSON.parse(xhr.responseText); }
        catch (e) { $('upTip').textContent = '响应解析失败'; return; }

        // 展示被拒绝的文件（如类型不支持）
        const rejected = (res.details || []).filter(d => !d.accepted);
        $('upTip').textContent = rejected.length
            ? `上传完成，其中 ${rejected.length} 个文件被跳过：${rejected.map(r => r.filename + '（' + r.reason + '）').join('、')}`
            : `上传完成，共 ${res.task_ids.length} 个文件已进入导入队列`;

        startPolling(res.task_ids);
    };

    xhr.onerror = () => { $('upTip').textContent = '上传失败：网络错误'; };
    xhr.send(fd);
}

function formatSize(b) {
    if (b < 1024) return b + ' B';
    if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
    return (b / 1048576).toFixed(2) + ' MB';
}

// ---------- 轮询任务状态 ----------
let timer = null;
const seenCost = {};   // 记录已展示过的节点耗时，避免重复渲染

function startPolling(taskIds) {
    if (timer) clearInterval(timer);
    $('logBox').classList.add('open');

    timer = setInterval(async () => {
        let finished = 0;
        for (const tid of taskIds) {
            const info = await fetchStatus(tid);
            if (!info) continue;
            renderStatus(info);
            if (info.status === 'completed' || info.status === 'failed') finished++;
        }
        if (finished === taskIds.length) {
            clearInterval(timer);
            timer = null;
        }
    }, 2000);
}

async function fetchStatus(tid) {
    try {
        const r = await fetch('/status/' + tid);
        return await r.json();
    } catch (e) {
        return null;
    }
}

const STATUS_TEXT = {
    pending: '⏳ 排队中...',
    processing: '🔄 处理中...',
    completed: '✅ 已完成',
    failed: '❌ 处理失败'
};

function renderStatus(info) {
    const box = $('status');
    box.style.display = 'block';
    box.className = info.status;
    $('stText').textContent = STATUS_TEXT[info.status] || info.status;
    $('stTid').textContent = 'task_id: ' + info.task_id;

    const done = info.done_list || [];
    const running = info.running_list || [];
    const failed = info.failed_list || [];

    // 按节点执行顺序渲染，已完成的显示耗时，未到达的置灰
    let html = '';
    for (const name of NODE_ORDER) {
        let cls = 'wait', text = '等待中';
        if (failed.includes(name)) { cls = 'err'; text = '失败'; }
        else if (done.includes(name)) {
            cls = 'ok';
            const c = seenCost[name];
            text = c ? `完成（${c}ms）` : '完成';
        } else if (running.includes(name)) { cls = 'run'; text = '执行中...'; }
        html += `<div class="row"><span class="nm">${name}</span>`
              + `<span class="tag ${cls}">${text}</span></div>`;
    }
    $('log').innerHTML = html;
}
</script>
</body>
</html>
