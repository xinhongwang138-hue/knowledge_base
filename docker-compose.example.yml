# 示例编排文件（脱敏版），复制为 docker-compose.yml 后按本机环境调整
#   cp docker-compose.example.yml docker-compose.yml
# 需在 .env 中设置：MINIO_ROOT_PASSWORD / MONGO_ROOT_PASSWORD
# 可用变量：DOCKER_DATA_ROOT（容器卷数据根目录）、AI_MODELS_PATH（本地模型目录）
# 知识库依赖服务统一编排：Milvus 三件套 + Attu + 后端 API
# 由现有容器（milvus-etcd / milvus-minio / milvus-standalone / attu）融合而来
# 数据卷沿用原 bind 目录，切换不丢数据
#
# 端口策略：宿主侧统一绑定 127.0.0.1，仅本机可访问；
#           容器间互访走服务名（minio:9000 / etcd:2379 / milvus-standalone:19530），
#           不受宿主侧 127.0.0.1 绑定影响
name: kb-stack

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.25
    container_name: milvus-etcd
    restart: unless-stopped
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379
    command:
      - etcd
      - --data-dir=/etcd
    volumes:
      - etcd_data:/etcd
    networks:
      - milvus

  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    container_name: milvus-minio
    restart: unless-stopped
    environment:
      - MINIO_ROOT_USER=kbadmin
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?set in .env}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    networks:
      - milvus

  standalone:
    image: milvusdb/milvus:v3.0.2
    container_name: milvus-standalone
    restart: unless-stopped
    environment:
      - ETCD_ENDPOINTS=etcd:2379
      - MINIO_ADDRESS=minio:9000
      - MINIO_ACCESS_KEY_ID=kbadmin
      - MINIO_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:?set in .env}
      - MINIO_REGION=us-east-1
    command: ["milvus", "run", "standalone"]
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "127.0.0.1:19530:19530"
      - "127.0.0.1:9091:9091"
    networks:
      - milvus
    depends_on:
      - etcd
      - minio

  attu:
    image: zilliz/attu:v2.4
    container_name: attu
    restart: unless-stopped
    environment:
      - MILVUS_URL=milvus-standalone:19530
    ports:
      - "127.0.0.1:8000:3000"
    networks:
      - milvus
    depends_on:
      - standalone

  # ===== MongoDB（会话历史），容器内常驻，替代宿主 mongod 依赖 =====
  # 宿主原有 mongod 仍占 27017，容器对外统一走 27018，互不干扰，便于回滚
  # 镜像取自本机已缓存的 1ms 源（docker.io 直连返回 401）
  mongo:
    image: docker.1ms.run/library/mongo:7.0
    container_name: kb-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_ROOT_PASSWORD}"
      TZ: Asia/Shanghai
    volumes:
      - mongo_data:/data/db
    ports:
      - "127.0.0.1:27018:27017"
    networks:
      - milvus
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 25s

  # ===== 知识库后端 API（导入 / 查询），Docker 常驻、自动重启 =====
  # 与 Milvus / Mongo 同处 milvus 网络，通过服务名互访
  # MINIO_ENDPOINT 供容器内客户端连接（服务名 minio），
  # MINIO_PUBLIC_ENDPOINT 供浏览器访问预签名 URL（宿主回环地址），二者必须分离
  import-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kb-import-api
    restart: unless-stopped
    command: python -m app.import_process.api.file_import_service
    environment:
      APP_HOST: "0.0.0.0"
      MILVUS_URL: "http://milvus-standalone:19530"
      MONGO_URL: "mongodb://admin:${MONGO_ROOT_PASSWORD}@mongo:27017/?authSource=admin"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_PUBLIC_ENDPOINT: "127.0.0.1:9000"
      BGE_M3_PATH: "/ai_models/modelscope_cache/models/BAAI/bge-m3"
      BGE_RERANKER_LARGE: "/ai_models/modelscope_cache/models/rerank/BAAI/bge-reranker-large"
      PYTHONPATH: "/app"
    volumes:
      # 代码以 bind mount 挂载：改完代码重启容器即生效，无需重建镜像
      # （当前机器拉取 docker.io 基础镜像返回 401，构建链路不可用）
      - ./app:/app/app
      - ./.env:/app/.env:ro
      - ${AI_MODELS_PATH:-./ai_models}:/ai_models:ro
      - ./output:/app/output
      - ./logs:/app/logs
    ports:
      - "127.0.0.1:8010:8010"
    networks:
      - milvus
    depends_on:
      - standalone
      - mongo
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/import.html')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  query-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kb-query-api
    restart: unless-stopped
    command: python -m app.query_process.api.query_service
    environment:
      APP_HOST: "0.0.0.0"
      # 容器内必须钉死 8011：查询服务端口由 QUERY_PORT 决定，而 .env 以 :ro 挂进容器。
      # 宿主开发把 QUERY_PORT 设成别的值（例如为了与容器并存用 8012）会让容器内监听
      # 该端口，而 ports 与 healthcheck 都指向 8011 —— 表现为容器 unhealthy、宿主 8011
      # 连不上。这里显式覆盖，避免宿主开发配置把容器带偏。
      QUERY_PORT: "8011"
      MILVUS_URL: "http://milvus-standalone:19530"
      MONGO_URL: "mongodb://admin:${MONGO_ROOT_PASSWORD}@mongo:27017/?authSource=admin"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_PUBLIC_ENDPOINT: "127.0.0.1:9000"
      BGE_M3_PATH: "/ai_models/modelscope_cache/models/BAAI/bge-m3"
      BGE_RERANKER_LARGE: "/ai_models/modelscope_cache/models/rerank/BAAI/bge-reranker-large"
      PYTHONPATH: "/app"
    volumes:
      # 代码以 bind mount 挂载：改完代码重启容器即生效，无需重建镜像
      # （当前机器拉取 docker.io 基础镜像返回 401，构建链路不可用）
      - ./app:/app/app
      - ./.env:/app/.env:ro
      - ${AI_MODELS_PATH:-./ai_models}:/ai_models:ro
      - ./output:/app/output
      - ./logs:/app/logs
    ports:
      - "127.0.0.1:8011:8011"
    networks:
      - milvus
    depends_on:
      - standalone
      - mongo
    healthcheck:
      # 只有 ok:true（Mongo 与 Milvus 均可用）才算健康，HTTP 5xx 直接判定失败
      test: ["CMD", "python", "-c", "import json,sys,urllib.request; r=json.load(urllib.request.urlopen('http://localhost:8011/health',timeout=8)); sys.exit(0 if r.get('ok') else 1)"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 120s

volumes:
  etcd_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DOCKER_DATA_ROOT:-./docker-data}/etcd
  minio_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DOCKER_DATA_ROOT:-./docker-data}/minio
  milvus_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DOCKER_DATA_ROOT:-./docker-data}/milvus
  mongo_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DOCKER_DATA_ROOT:-./docker-data}/mongo

networks:
  milvus:
    driver: bridge
